name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish (e.g. v0.5.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin the exact uv version so release artifacts are always built
          # with a known toolchain; "latest" would drift between releases.
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          DIST_NAME: dotenvmodel
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          version="$(uv run python -c 'import importlib.metadata, os; print(importlib.metadata.version(os.environ["DIST_NAME"]))')"
          echo "Tag: ${tag}"
          echo "project version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Git tag ${tag} does not match project version ${version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test install from wheel
        env:
          DIST_NAME: dotenvmodel
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          cd /tmp && $GITHUB_WORKSPACE/test-env/bin/python -c "import importlib.metadata, os; print(importlib.metadata.version(os.environ['DIST_NAME']))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dotenvmodel/
    permissions:
      # Granted solely to mint this job's OIDC token for PyPI trusted
      # publishing; no other permission is used in this job.
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Same pinned uv version as the build job so the upload step is
          # reproducible and matches the toolchain that built the artifacts.
          version: "0.11.32"
          # Nothing is installed in this job, so a cache would only add
          # save/restore time to every release.
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        # "always" requires the PyPI trusted publisher to succeed: uv must
        # mint the job's OIDC token and never fall back to credentials, so
        # a broken trusted-publisher setup fails loudly instead of hanging
        # on a missing token. uv publishes everything in dist/ by default.
        #
        # Attestations stay off: this workflow is also invoked as a reusable
        # workflow, where the Sigstore signing identity is the caller's
        # top-level workflow, which cannot match this repository's PyPI
        # trusted publisher configuration.
        run: uv publish --trusted-publishing always --no-attestations
