name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "docs/**"
      - "dotenvmodel/**"
      - "mkdocs.yml"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      # `make docs` generates docs/changelog.md from the release-please-managed
      # CHANGELOG.md (so the published page can never drift from it) and builds
      # with --strict — the same recipe contributors run locally.
      - name: Build MkDocs site
        run: make docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # deploy-pages' documented minimum: pages creates the Pages
      # deployment through the REST API and id-token mints the OIDC
      # token that proves the deployment originates from this workflow.
      # The build job needs neither, so they are scoped here instead of
      # being granted workflow-wide.
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
